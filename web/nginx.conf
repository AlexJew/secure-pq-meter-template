# Serves the Angular dashboard's static build and reverse-proxies
# /edh/v1/* to pq-meter-server's plain-HTTP data API (web_api::WEB_API_PORT,
# fixed at 31030), which runs on the host, not in this container — the same
# job proxy.conf.json does for `ng serve` in local dev.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /edh/v1/ {
        # host.docker.internal reaches the host from inside the container:
        # built in on Docker Desktop (macOS/Windows), added explicitly via
        # docker-compose.yml's `extra_hosts` for Linux.
        proxy_pass http://host.docker.internal:31030;
        proxy_set_header Host $host;
    }

    # No CORS and no absolute-URL fetches, matching pq-meter-server/API.md's
    # "same-origin until a real deployment exists" constraint — this proxy
    # is what keeps the built app inside that constraint despite living in
    # its own container, not just its own `ng serve` process.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
