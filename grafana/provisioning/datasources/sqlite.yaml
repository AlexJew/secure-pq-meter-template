# Provisions the frser-sqlite-datasource plugin to read the server's SQLite
# file directly. See ../../docker-compose.yml for how /data is mounted, and
# https://github.com/fr-ser/grafana-sqlite-datasource/blob/main/docs/faq.md#can-i-use-provisioning-with-this-plugin
# for the provisioning shape this follows.
apiVersion: 1

datasources:
  - name: pq-meter
    uid: pqmeter
    type: frser-sqlite-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      path: /data/pqmeter.db
